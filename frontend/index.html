<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Lumen Vault is a calm, private home for your files. Store, organize, preview and share your work from any device." />
    <meta name="theme-color" content="#e9e4db" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23101828'/%3E%3Cpath d='M11 8.5h3.4v11.6h7.6v3.4H11z' fill='%23fff'/%3E%3C/svg%3E" />
    <title>Lumen Vault — Your files, kept close</title>
    <script>
      // Resolve the theme before first paint so a dark-mode user never sees a
      // white flash. Kept in sync with src/theme.js.
      (function () {
        try {
          var stored = localStorage.getItem("lumenvault-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", theme === "dark" ? "#14161c" : "#e9e4db");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
